version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - cast_spell
  - check_status
  - list_spells
  - rest
  - repeat_last_action
  - reset_game

entities:
  - spell_type
  - target

slots:
  spell_type:
    type: text
    mappings:
    - type: from_entity
      entity: spell_type
  target:
    type: text
    mappings:
    - type: from_entity
      entity: target
  last_action:
    type: text
    mappings:
    - type: custom
  last_spell_type:
    type: text
    mappings:
    - type: custom
  last_target:
    type: text
    mappings:
    - type: custom

actions:
  - action_cast_spell
  - action_check_status
  - action_list_spells
  - action_reset_game
  - action_rest
  - action_repeat_last

responses:
  utter_greet:
  - text: "🧙 ¡Bienvenido, Mago! ¿Listo para luchar contra enemigos? Prueba decir 'lanza bola de fuego al golem' o 'revisar estado'!"

  utter_cheer_up:
  - text: "Aquí hay algo para animarte:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "¿Te ayudó eso?"

  utter_happy:
  - text: "¡Genial, continúa!"

  utter_goodbye:
  - text: "🧙 ¡Que tus hechizos sean siempre poderosos! ¡Adiós, mago!"

  utter_iamabot:
  - text: "Soy un bot, desarrollado con Rasa. ¡Te ayudo a luchar contra enemigos con magia!"

  utter_ask_spell_target:
  - text: "¿Qué hechizo quieres lanzar y a qué enemigo?"

  utter_game_help:
  - text: "🎮 Comandos disponibles:\n- 'lanza [hechizo] al [enemigo]'\n- 'revisar estado'\n- 'listar hechizos'"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
